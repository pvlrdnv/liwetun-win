name: Windows health TLS candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tls:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Compile private loopback TLS driver
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/health/tls_fixture_client.cpp /Fobuild/health-tls-probe.obj /Febuild/health-tls-probe.exe /link secur32.lib crypt32.lib ws2_32.lib
          if ($LASTEXITCODE -ne 0) { throw 'TLS fixture client build failed' }
      - name: Real TLS HTTP and certificate refusal with exact temporary-root cleanup
        run: |
          python tools/fixtures/health_tls.py --client build/health-tls-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Loopback TLS candidate not qualified' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: health-tls-safe-evidence
          path: build/health-tls-evidence/
          retention-days: 7
          if-no-files-found: warn
