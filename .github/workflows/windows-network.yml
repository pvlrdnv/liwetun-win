name: Windows real TUN network qualification
on:
  workflow_dispatch:
    inputs:
      source_pins:
        description: Qualify the separately pinned immutable-source SDK candidate
        type: boolean
        default: false
      traffic_metrics:
        description: Qualify the separate aggregate-traffic SDK candidate (requires source_pins)
        type: boolean
        default: false
      attached_tun:
        description: CI-only SDK-held attachment fence (requires traffic_metrics/source_pins)
        type: boolean
        default: false
      owned_probe:
        description: CI-only service-owned synthetic TCP path proof (requires all SDK profiles)
        type: boolean
        default: false
      owned_probe_mode:
        description: Exact echo, cancellation, deadline, or deliberately wrong reply nonce
        type: choice
        default: echo
        options:
          - echo
          - cancel
          - deadline
          - wrong-nonce
          - migration
          - epoch-change
          - bypass
          - https
          - https-wrong-nonce
          - https-untrusted
          - https-deadline
          - https-cancel
      traffic_pattern:
        description: Normal traffic or a tiny TX-only native counter observation window
        type: choice
        default: normal
        options:
          - normal
          - tx-only
      sdk_run_id:
        description: Successful SDK qualification run in this repository
        required: true
        default: '43752644532'
        type: string
      endpoint_fixture_run:
        description: Optional pinned successful diagnostic endpoint build (empty selects official release)
        required: false
        default: ''
        type: string
      endpoint_stream_close:
        description: Explicit focused experiment with the separately pinned H3 reader-wakeup endpoint
        required: false
        default: false
        type: boolean
      diagnostic_only:
        description: H2 diagnostic only (never a complete qualification)
        required: false
        default: false
        type: boolean
      production_probe:
        description: Single unbound IPv4 HTTPS/DNS probe with production routing and a physically bound endpoint forwarder
        required: false
        default: false
        type: boolean
      production_transport:
        description: Transport for the single production routing probe
        required: false
        default: http2
        type: choice
        options:
          - http2
          - http3
      production_termination:
        description: Stop, lease death, service crash, or recover from an owned endpoint restart
        required: false
        default: stop
        type: choice
        options:
          - stop
          - lease-death
          - service-crash
          - endpoint-restart
      production_profile:
        description: Valid profile or isolated wrong-auth / wrong-CA startup refusal (H2 Stop only)
        required: false
        default: valid
        type: choice
        options:
          - valid
          - wrong-auth
          - wrong-ca
      production_family:
        description: IPv4 or synthetic IPv6 TUN TCP/UDP through a fixed NAT64 CI exit (not native IPv6 Internet)
        required: false
        default: ipv4
        type: choice
        options:
          - ipv4
          - synthetic-ipv6
      endpoint_version:
        description: Pinned official endpoint version to compare
        required: true
        default: v1.1.0
        type: choice
        options:
          - v1.1.0
          - v1.3.0-beta.2
permissions:
  contents: read
  actions: read
jobs:
  network:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      SOURCE_PINNED: ${{ inputs.source_pins }}
      TRAFFIC_METRICS: ${{ inputs.traffic_metrics }}
      ATTACHED_TUN: ${{ inputs.attached_tun }}
      OWNED_PROBE: ${{ inputs.owned_probe }}
      LIWETUN_OWNED_PROBE_MODE: ${{ inputs.owned_probe_mode }}
      LIWETUN_TRAFFIC_PATTERN: ${{ inputs.traffic_pattern }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id }}
      GH_TOKEN: ${{ github.token }}
      LIWETUN_CI_DISTRO: LiWeTunCI${{ github.run_id }}
      LIWETUN_NETWORK_DIAGNOSTIC: ${{ inputs.diagnostic_only }}
      LIWETUN_ENDPOINT_VERSION: ${{ inputs.endpoint_version }}
      LIWETUN_ENDPOINT_FIXTURE_RUN: ${{ inputs.endpoint_fixture_run }}
      LIWETUN_ENDPOINT_STREAM_CLOSE: ${{ inputs.endpoint_stream_close }}
      LIWETUN_PRODUCTION_PROBE: ${{ inputs.production_probe }}
      LIWETUN_PRODUCTION_TRANSPORT: ${{ inputs.production_transport }}
      LIWETUN_PRODUCTION_TERMINATION: ${{ inputs.production_termination }}
      LIWETUN_PRODUCTION_PROFILE: ${{ inputs.production_profile }}
      LIWETUN_PRODUCTION_FAMILY: ${{ inputs.production_family }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build real service with explicit disposable network fixture mode
        run: |
          if ($env:TRAFFIC_METRICS -eq 'true' -and $env:LIWETUN_PRODUCTION_PROBE -ne 'true') { throw 'Aggregate traffic qualification requires ordinary traffic mode' }
          if ($env:ATTACHED_TUN -eq 'true' -and ($env:SOURCE_PINNED -ne 'true' -or $env:TRAFFIC_METRICS -ne 'true')) { throw 'Attachment fence requires aggregate immutable-source profile' }
          if ($env:OWNED_PROBE -eq 'true' -and ($env:ATTACHED_TUN -ne 'true' -or $env:LIWETUN_PRODUCTION_PROFILE -ne 'valid' -or $env:LIWETUN_PRODUCTION_FAMILY -ne 'ipv4' -or $env:LIWETUN_PRODUCTION_TERMINATION -ne 'stop' -or $env:LIWETUN_TRAFFIC_PATTERN -ne 'normal')) { throw 'Owned probe requires its focused IPv4 Stop/normal fixture' }
          if ($env:LIWETUN_OWNED_PROBE_MODE -notin @('echo','cancel','deadline','wrong-nonce','migration','epoch-change','bypass','https','https-wrong-nonce','https-untrusted','https-deadline','https-cancel') -or ($env:LIWETUN_OWNED_PROBE_MODE -ne 'echo' -and $env:OWNED_PROBE -ne 'true')) { throw 'Negative fixture requires owned probe mode' }
          if ($env:LIWETUN_ENDPOINT_STREAM_CLOSE -eq 'true' -and (!$env:LIWETUN_ENDPOINT_FIXTURE_RUN -or $env:OWNED_PROBE -ne 'true')) { throw 'Endpoint wakeup candidate requires explicit focused owned probe fixture' }
          if ($env:LIWETUN_PRODUCTION_PROBE -ne 'true' -and $env:LIWETUN_PRODUCTION_FAMILY -ne 'ipv4') { throw 'Synthetic IPv6 requires production probe mode' }
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
          $bounded = if ($env:LIWETUN_PRODUCTION_PROBE -eq 'true') { 'OFF' } else { 'ON' }
          $attachmentGuard = if ($env:ATTACHED_TUN -eq 'true') { 'ON' } else { 'OFF' }
          $ownedHttps = if ($env:LIWETUN_OWNED_PROBE_MODE -like 'https*') { 'ON' } else { 'OFF' }
          $ownedBypass = if ($env:LIWETUN_OWNED_PROBE_MODE -eq 'bypass') { 'ON' } else { 'OFF' }
          $ownedMigration = if ($env:LIWETUN_OWNED_PROBE_MODE -eq 'migration') { 'ON' } else { 'OFF' }
          $ownedProbe = if ($env:OWNED_PROBE -eq 'true') { 'ON' } else { 'OFF' }
          cmake -S native/service -B build/service -A x64 -DLIWETUN_TEST_NO_GLOBAL_ROUTES=OFF "-DLIWETUN_TEST_TUN_NETWORK=$bounded" "-DLIWETUN_TEST_ATTACHED_TUN=$attachmentGuard" "-DLIWETUN_TEST_OWNED_PROBE=$ownedProbe" "-DLIWETUN_TEST_OWNED_MIGRATION=$ownedMigration" "-DLIWETUN_TEST_OWNED_BYPASS=$ownedBypass" "-DLIWETUN_TEST_OWNED_HTTPS=$ownedHttps"
          if ($LASTEXITCODE -ne 0) { throw 'Service configure failed' }
          cmake --build build/service --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          if ($env:ATTACHED_TUN -eq 'true') {
            if (!(Select-String -Path build/service/CMakeCache.txt -Pattern '^LIWETUN_TEST_ATTACHED_TUN:BOOL=ON$' -Quiet)) { throw 'Attachment fence build mode missing' }
            cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /Inative/traffic native/health/test_attached_tun.cpp /Fobuild/attachment-context.obj /Febuild/attachment-context.exe
            if ($LASTEXITCODE -ne 0) { throw 'Attachment context contract build failed' }
            & ./build/attachment-context.exe
            if ($LASTEXITCODE -ne 0) { throw 'Attachment context contract failed' }
            New-Item -ItemType Directory -Force build/service-evidence | Out-Null
            @{ci_only_guard_enabled=$true; contract_passed=$true; routing_policy_changed=$false; interface_identifiers_exported=$false; release_ready=$false} | ConvertTo-Json | Set-Content build/service-evidence/attachment-context-guard.json
          }
          cargo run --manifest-path native/trusttunnel_bridge/Cargo.toml --locked --release --example synthetic_fixture -- build/native-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'Fixture generation failed' }
          $fixtures = Get-Content build/native-fixture.json -Raw | ConvertFrom-Json
          $fixtures.SYNTHETIC_TT_SERVICE_LOCAL | Set-Content -Encoding utf8 build/service-local-uri.txt
      - name: Fetch previously qualified SDK from this repository
        run: |
          if ($env:SDK_RUN_ID -notmatch '^[0-9]{1,20}$') { throw 'Invalid SDK run ID' }
          if ($env:TRAFFIC_METRICS -eq 'true' -and $env:SOURCE_PINNED -ne 'true') { throw 'Traffic SDK requires immutable source pins' }
          $pinFile = if ($env:OWNED_PROBE -eq 'true') { 'native/sdk/runtime-probe.json' } elseif ($env:ATTACHED_TUN -eq 'true') { 'native/sdk/runtime-attached.json' } elseif ($env:TRAFFIC_METRICS -eq 'true') { 'native/sdk/runtime-traffic.json' } elseif ($env:SOURCE_PINNED -eq 'true') { 'native/sdk/runtime-sources.json' } else { 'native/sdk/runtime.json' }
          $pin = Get-Content $pinFile -Raw | ConvertFrom-Json
          if ($env:SOURCE_PINNED -eq 'true') {
            if ($pin.source_pin_manifest_sha256 -ne (Get-FileHash native/sdk/source-pins.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.conan_input_lock_sha256 -ne (Get-FileHash native/sdk/conan-sources.lock -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.source_pinned_candidate -ne $true -or $pin.release_qualified -ne $false) { throw 'Candidate SDK source receipt mismatch' }
          }
          if ($env:TRAFFIC_METRICS -eq 'true') {
            $variant = if ($env:OWNED_PROBE -eq 'true') { 'owned_socket_probe_candidate' } elseif ($env:ATTACHED_TUN -eq 'true') { 'attached_tun_candidate' } else { 'aggregate_traffic_candidate' }
            if ($pin.traffic_profile_manifest_sha256 -ne (Get-FileHash native/sdk/traffic-inputs.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.traffic_abi_header_sha256 -ne (Get-FileHash native/traffic/traffic_abi.h -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.traffic_abi -ne 1 -or $pin.sdk_variant -ne $variant) { throw 'Traffic SDK receipt mismatch' }
          }
          if ($env:ATTACHED_TUN -eq 'true') {
            if ($pin.attached_tun_profile_manifest_sha256 -ne (Get-FileHash native/sdk/attached-tun-inputs.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.attached_tun_abi_header_sha256 -ne (Get-FileHash native/health/attached_tun_abi.h -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.attached_tun_abi -ne 1) { throw 'Attached TUN SDK receipt mismatch' }
          }
          if ($env:OWNED_PROBE -eq 'true') {
            if ($pin.owned_probe_profile_manifest_sha256 -ne (Get-FileHash native/sdk/owned-probe-inputs.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.owned_probe_abi_header_sha256 -ne (Get-FileHash native/probe/probe_abi.h -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.owned_probe_abi -ne 1) { throw 'Owned probe SDK receipt mismatch' }
          }
          if ($env:SDK_RUN_ID -ne [string]$pin.source_run) { throw 'SDK run does not match reviewed runtime manifest' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SDK_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.name -ne 'Windows SDK qualification' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $pin.source_commit) { throw 'SDK run not qualified' }
          gh run download $env:SDK_RUN_ID --repo $env:GITHUB_REPOSITORY --name sdk-development-runtime-not-for-release --dir build/sdk-runtime
          if ($LASTEXITCODE -ne 0) { throw 'SDK download failed' }
          foreach ($file in @('trusttunnel.dll', 'wintun.dll')) {
            $expected = $pin.files.PSObject.Properties[$file].Value
            if ($expected -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash (Join-Path build/sdk-runtime $file) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'SDK digest mismatch' }
          }
          New-Item -ItemType Directory -Force build/service-evidence | Out-Null
          Copy-Item $pinFile build/service-evidence/sdk-runtime-input.json
      - name: Prepare task-only WSL1 endpoint with pinned image and binary
        run: |
          Invoke-WebRequest https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04.5-base-amd64.tar.gz -OutFile build/ubuntu-base.tar.gz
          if ((Get-FileHash build/ubuntu-base.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne '242cd8898b33ea806ef5f13b1076ed7c76f9f989d18384452f7166692438ff1a') { throw 'Rootfs digest mismatch' }
          if ($env:LIWETUN_ENDPOINT_VERSION -eq 'v1.1.0') {
            $endpointDigest = '91c2ea3db7416a01b5258a4c047ec22890490bc55e1b194206031aa75144f0e7'
          } elseif ($env:LIWETUN_ENDPOINT_VERSION -eq 'v1.3.0-beta.2') {
            $endpointDigest = '496a27ff72014b883438efab55ffd237183b5ff95d9c341cc0de9d18342a9b11'
          } else { throw 'Unpinned endpoint version' }
          if ($env:LIWETUN_ENDPOINT_FIXTURE_RUN) {
            if ($env:LIWETUN_ENDPOINT_FIXTURE_RUN -notmatch '^[0-9]{1,20}$' -or $env:LIWETUN_ENDPOINT_VERSION -ne 'v1.1.0' -or $env:LIWETUN_PRODUCTION_PROBE -ne 'true') { throw 'Invalid diagnostic endpoint request' }
            $receiptPath = if ($env:LIWETUN_ENDPOINT_STREAM_CLOSE -eq 'true') { 'tools/service/endpoint-runtime-close.json' } else { 'tools/service/endpoint-runtime.json' }
            $receipt = Get-Content $receiptPath -Raw | ConvertFrom-Json
            $sourcePin = Get-Content tools/service/endpoint-source.json -Raw | ConvertFrom-Json
            if ($env:LIWETUN_ENDPOINT_FIXTURE_RUN -ne [string]$receipt.source_run) { throw 'Unreviewed diagnostic endpoint run' }
            $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:LIWETUN_ENDPOINT_FIXTURE_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.name -ne 'Official endpoint UDP isolation' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $receipt.workflow_commit) { throw 'Diagnostic endpoint run not qualified' }
            gh run download $env:LIWETUN_ENDPOINT_FIXTURE_RUN --repo $env:GITHUB_REPOSITORY --name diagnostic-endpoint-not-for-release --dir build/endpoint
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostic endpoint download failed' }
            $files = @(Get-ChildItem build/endpoint -Force)
            if ($files.Count -ne 2 -or @($files | Where-Object { $_.PSIsContainer -or $_.Name -notin @('trusttunnel_endpoint','fixture-provenance.json') -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }).Count) { throw 'Unexpected diagnostic endpoint files' }
            $provenance = Get-Content build/endpoint/fixture-provenance.json -Raw | ConvertFrom-Json
            $actual = (Get-FileHash build/endpoint/trusttunnel_endpoint -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($receipt.binary_sha256 -notmatch '^[0-9a-f]{64}$' -or $actual -ne $receipt.binary_sha256 -or $actual -ne $provenance.binary_sha256 -or $provenance.source_commit -ne $sourcePin.source_commit -or $provenance.patch_sha256 -ne $sourcePin.patch_sha256 -or $provenance.source_archive_sha256 -ne $sourcePin.source_archive_sha256 -or $provenance.diagnostic_source_fix -ne $true -or $provenance.release_ready -ne $false) { throw 'Diagnostic endpoint provenance mismatch' }
            if ($env:LIWETUN_ENDPOINT_STREAM_CLOSE -eq 'true') {
              $closePin = Get-Content tools/service/endpoint-close-inputs.json -Raw | ConvertFrom-Json
              $closeDigest = (Get-FileHash tools/service/endpoint-close-inputs.json -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($receipt.endpoint_close_manifest_sha256 -ne $closeDigest -or $provenance.endpoint_close_manifest_sha256 -ne $closeDigest -or $receipt.endpoint_close_source_sha256 -ne $closePin.output_sha256 -or $provenance.endpoint_close_source_sha256 -ne $closePin.output_sha256 -or $receipt.endpoint_close_fix -ne $true -or $provenance.endpoint_close_fix -ne $true -or $receipt.release_ready -ne $false) { throw 'Endpoint wakeup provenance mismatch' }
            } elseif ($provenance.endpoint_close_fix -eq $true) { throw 'Endpoint wakeup candidate requires explicit opt-in' }
          } else {
            Invoke-WebRequest "https://github.com/TrustTunnel/TrustTunnel/releases/download/${env:LIWETUN_ENDPOINT_VERSION}/trusttunnel-${env:LIWETUN_ENDPOINT_VERSION}-linux-x86_64.tar.gz" -OutFile build/endpoint.tar.gz
            if ((Get-FileHash build/endpoint.tar.gz -Algorithm SHA256).Hash.ToLowerInvariant() -ne $endpointDigest) { throw 'Endpoint digest mismatch' }
            New-Item -ItemType Directory -Force build/endpoint | Out-Null
            tar -xf build/endpoint.tar.gz -C build/endpoint --strip-components=1
            if ($LASTEXITCODE -ne 0) { throw 'Endpoint extraction failed' }
          }
          $install = Join-Path $env:RUNNER_TEMP $env:LIWETUN_CI_DISTRO
          wsl --import $env:LIWETUN_CI_DISTRO $install build/ubuntu-base.tar.gz --version 1
          if ($LASTEXITCODE -ne 0) { throw 'Task WSL1 import failed' }
          'LIWETUN_DISTRO_CREATED=true' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          wsl -d $env:LIWETUN_CI_DISTRO -- sh -c 'apt-get update >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 openssl ca-certificates >/dev/null 2>&1'
          if ($LASTEXITCODE -ne 0) { throw 'Task Linux test tools failed' }
      - name: Real signed service TUN HTTPS DNS H2 H3 and stop/crash tests
        run: |
          python -m unittest discover -s tools/service -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Protocol and restoration observation fixtures failed' }
          if ($env:LIWETUN_PRODUCTION_PROBE -eq 'true') { ./tools/service/qualify.ps1 -Sdk build/sdk-runtime -Network -ProductionTraffic }
          else { ./tools/service/qualify.ps1 -Sdk build/sdk-runtime -Network }
      - name: Remove exact task-created Linux fixture
        if: always() && env.LIWETUN_DISTRO_CREATED == 'true'
        run: |
          wsl --terminate $env:LIWETUN_CI_DISTRO
          wsl --unregister $env:LIWETUN_CI_DISTRO
          if ($LASTEXITCODE -ne 0) { throw 'Task WSL cleanup failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tun-network-safe-evidence
          path: build/service-evidence/
          retention-days: 7
          if-no-files-found: warn
