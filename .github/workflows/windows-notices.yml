name: Windows archived notice integrity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notices:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify exact candidate texts and dependency membership
        run: |
          python tools/sdk/verify_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate notice integrity failed' }
          python -m unittest discover -s tools/sdk -p test_notices.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Candidate notice guard checks failed' }
