name: Windows native import check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-import:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned development tools on disposable runner
        run: |
          $flutterDir = Join-Path $env:RUNNER_TEMP 'liwetun-flutter'
          git clone --depth 1 --branch 3.38.10 https://github.com/flutter/flutter.git $flutterDir
          if ($LASTEXITCODE -ne 0) { throw 'Flutter checkout failed' }
          $revision = (git -C $flutterDir rev-parse HEAD).Trim()
          if ($revision -ne 'c6f67dede3d4aa1aa7a69dd56a3494a5cde6cc80') { throw 'Flutter revision mismatch' }
          (Join-Path $flutterDir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
      - name: Verify native formatting
        run: cargo fmt --manifest-path native/trusttunnel_bridge/Cargo.toml -- --check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Test actual official decoder through the C ABI
        run: cargo test --manifest-path native/trusttunnel_bridge/Cargo.toml --locked
      - name: Prepare synthetic fixtures without printing links
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cargo run --manifest-path native/trusttunnel_bridge/Cargo.toml --locked --release --example synthetic_fixture -- build/native-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed' }
      - name: Verify Dart dependency lock
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed' }
          git diff --exit-code -- pubspec.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dart dependency lock changed' }
      - name: Collect locked Rust dependency notice candidates
        run: |
          cargo metadata --manifest-path native/trusttunnel_bridge/Cargo.toml --locked --offline --format-version 1 | Set-Content -Encoding utf8 build/cargo-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Locked Cargo metadata failed' }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          python tools/sdk/rust_notices.py --metadata build/cargo-metadata.json --cargo-home $cargoHome --output build/rust-notices
          if ($LASTEXITCODE -ne 0) { throw 'Rust notice collection failed' }
      - name: Analyze application
        run: flutter analyze --no-pub
      - name: Verify archived dependency notice candidates
        run: |
          python tools/sdk/verify_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Archived notice integrity failed' }
          python tools/sdk/client_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Generated client notice bundle drift' }
      - name: Generate isolated TLS fixture without system trust changes
        run: |
          $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          if (!(Test-Path $openssl -PathType Leaf)) { throw 'Runner OpenSSL fixture tool unavailable' }
          python tools/fixtures/subscription_tls.py --output build/subscription-tls --openssl $openssl
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic TLS fixture preparation failed' }
      - name: Run application and privacy unit tests
        env:
          LIWETUN_SUBSCRIPTION_TLS_FIXTURE: ${{ github.workspace }}/build/subscription-tls
        run: flutter test --no-pub --reporter expanded
      - name: Build Windows release shell with static native parser
        run: flutter build windows --release --no-pub
      - name: Exercise real Windows channel without installing or starting a service
        timeout-minutes: 10
        run: flutter test integration_test/native_bridge_test.dart -d windows --no-pub --dart-define-from-file=build/native-fixture.json
      - name: Write build evidence
        run: |
          $exe = 'build/windows/x64/runner/Release/liwetun.exe'
          if (!(Test-Path $exe)) { throw 'Expected Windows executable missing' }
          $noticePin = Get-Content tools/sdk/client-notices.json -Raw | ConvertFrom-Json
          $flutterDir = Join-Path $env:RUNNER_TEMP 'liwetun-flutter'
          $engine = (Get-Content (Join-Path $flutterDir 'bin/cache/engine.stamp') -Raw).Trim()
          if ($engine -ne $noticePin.flutter_engine_commit) { throw 'Flutter engine revision mismatch' }
          python tools/sdk/client_notices.py --bundle build/windows/x64/runner/Release/data/flutter_assets/NOTICES.Z --engine-license (Join-Path $flutterDir 'bin/cache/pkg/sky_engine/LICENSE') --report build/gui-notice-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native/engine notice bytes missing or changed' }
          $report = [ordered]@{
            source_commit = '${{ github.sha }}'
            decoder_revision = '48f424c0874eb6f6374ee84492c5cd55aa04dca9'
            runner_os = 'windows-2022'
            executable_sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            native_import = 'verified'
            protected_storage_channel = 'verified'
            profile_restore_without_autoconnect = 'verified'
            subscription_cache_revoke_replay_restore = 'verified_without_network'
            packaged_notice_bytes = 'verified_not_legal_approval'
            tunnel_service = 'not_installed'
            network_tests = 'not_run'
            release_ready = $false
          }
          $report | ConvertTo-Json | Set-Content -Encoding utf8 build/windows-import-evidence.json
      - name: Stage unsigned GUI runtime for isolated package qualification
        run: |
          $source = 'build/windows/x64/runner/Release'
          $destination = 'build/unsigned-gui-runtime'
          # Compiler output only; never enumerate user profiles or runtime logs.
          $inventory = @(Get-ChildItem $source -Force | ForEach-Object {
            @{
              name = $(if ($_.Name -cmatch '^[A-Za-z0-9_.-]{1,128}$') { $_.Name } else { 'redacted' })
              directory = $_.PSIsContainer
              reparse = [bool]($_.Attributes -band [IO.FileAttributes]::ReparsePoint)
            }
          })
          @{source_commit='${{ github.sha }}'; entries=$inventory; release_ready=$false} | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 build/gui-build-inventory.json
          if (Test-Path $destination) { throw 'Fresh GUI staging directory required' }
          New-Item -ItemType Directory $destination | Out-Null
          foreach ($entry in Get-ChildItem $source -Force) {
            if ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Unexpected GUI staging reparse point' }
            if ($entry.PSIsContainer) {
              if ($entry.Name -ne 'data') { throw 'Unexpected GUI runtime directory' }
              if (Get-ChildItem $entry.FullName -Recurse -Force | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }) { throw 'Unexpected GUI runtime reparse point' }
              Copy-Item $entry.FullName $destination -Recurse
            } elseif ($entry.Name -eq 'liwetun.exe' -or $entry.Extension -eq '.dll') {
              Copy-Item $entry.FullName $destination
            } elseif ($entry.Name -eq 'native_assets.json') {
              # Pinned Flutter writes this even when no Dart code assets exist.
              # A nonempty mapping needs a separate dependency/path review.
              if ($entry.Length -gt 1024 -or [IO.File]::ReadAllText($entry.FullName).Trim() -cne '{"format-version":[1,0,0],"native-assets":{}}') { throw 'Unexpected Flutter native asset mapping' }
              Copy-Item $entry.FullName $destination
            } elseif ($entry.Extension -notin @('.pdb', '.lib', '.exp', '.ilk')) {
              throw 'Unexpected GUI build output'
            }
          }
          foreach ($file in @('liwetun.exe', 'flutter_windows.dll', 'native_assets.json', 'data/app.so', 'data/icudtl.dat', 'data/flutter_assets/NOTICES.Z')) {
            if (!(Test-Path (Join-Path $destination $file) -PathType Leaf)) { throw 'Incomplete GUI runtime' }
          }
          $root = (Resolve-Path $destination).Path
          $files = @(Get-ChildItem $destination -File -Recurse | ForEach-Object {
            @{file=[IO.Path]::GetRelativePath($root,$_.FullName).Replace('\','/'); sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          })
          $noticePin = Get-Content tools/sdk/client-notices.json -Raw | ConvertFrom-Json
          $notices = Get-Content build/gui-notice-evidence.json -Raw | ConvertFrom-Json
          @{source_commit='${{ github.sha }}'; kind='unsigned_gui_ci_only'; release_ready=$false; files=$files; flutter_framework_revision=$noticePin.flutter_framework_commit; flutter_engine_revision=$noticePin.flutter_engine_commit; notice_verification=$notices} | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 build/gui-runtime-provenance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-notice-candidates-not-release-qualified
          path: build/rust-notices/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-import-evidence
          path: build/windows-import-evidence.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gui-build-inventory
          path: build/gui-build-inventory.json
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gui-notice-byte-evidence
          path: build/gui-notice-evidence.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-gui-runtime-ci-only
          path: build/unsigned-gui-runtime/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-gui-runtime-provenance
          path: build/gui-runtime-provenance.json
          retention-days: 14
          if-no-files-found: error
