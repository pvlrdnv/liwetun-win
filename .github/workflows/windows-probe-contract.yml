name: Windows owned probe contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-2022
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Compile and verify correlation and owned socket boundary
        run: |
          New-Item -ItemType Directory -Force build/probe-evidence | Out-Null
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX native/probe/test_probe_slot.cpp /Fobuild/probe-slot.obj /Febuild/probe-slot.exe
          if ($LASTEXITCODE -ne 0) { throw 'Owned probe slot build failed' }
          & ./build/probe-slot.exe
          if ($LASTEXITCODE -ne 0) { throw 'Owned probe slot contract failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /Inative/health native/probe/test_windows_socket.cpp /Fobuild/probe-socket.obj /Febuild/probe-socket.exe /link ws2_32.lib iphlpapi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Owned socket boundary build failed' }
          & ./build/probe-socket.exe
          if ($LASTEXITCODE -ne 0) { throw 'Owned socket boundary contract failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX native/health/test_http_probe.cpp /Fobuild/health-http.obj /Febuild/health-http.exe
          if ($LASTEXITCODE -ne 0) { throw 'Health HTTP contract build failed' }
          & ./build/health-http.exe
          if ($LASTEXITCODE -ne 0) { throw 'Health HTTP contract failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/health/test_schannel_probe.cpp /Fobuild/health-tls.obj /Febuild/health-tls.exe /link secur32.lib crypt32.lib ws2_32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Health Schannel candidate build failed' }
          & ./build/health-tls.exe
          if ($LASTEXITCODE -ne 0) { throw 'Health Schannel no-network guards failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/service/test_adapter_admission.cpp native/service/adapter_admission.cpp /Fobuild/ /Febuild/adapter-admission.exe /link iphlpapi.lib setupapi.lib
          if ($LASTEXITCODE -ne 0) { throw 'Read-only adapter admission build failed' }
          & ./build/adapter-admission.exe
          if ($LASTEXITCODE -ne 0) { throw 'Clean-host adapter admission failed' }
          @{source_commit='${{ github.sha }}'; slot_contract_passed=$true; actual_loopback_socket_boundary_passed=$true; http_response_contract_passed=$true; schannel_compile_and_preflight_guards_passed=$true; adapter_names_clean_host_preflight_passed=$true; adapter_ownership_qualified=$false; schannel_handshake_tested=$false; synthetic_context_not_sdk_tun=$true; tunnel_started=$false; network_configuration_changed=$false; live_sdk_path_qualified=$false; https_transport_qualified=$false; release_ready=$false} | ConvertTo-Json | Set-Content build/probe-evidence/contract.json
      - name: Verify fresh adapter factory without creating an adapter
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX native/health/test_fresh_adapter.cpp /Fobuild/fresh-adapter.obj /Febuild/fresh-adapter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fresh adapter policy build failed' }
          & ./build/fresh-adapter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Fresh adapter policy contract failed' }
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 native/health/test_windows_fresh_adapter.cpp /Fobuild/windows-fresh-adapter.obj /Febuild/windows-fresh-adapter.exe /link bcrypt.lib iphlpapi.lib ws2_32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Read-only fresh adapter Windows binding build failed' }
          & ./build/windows-fresh-adapter.exe
          if ($LASTEXITCODE -ne 0) { throw 'Read-only fresh adapter Windows binding contract failed' }
          python -m unittest discover -s tools/sdk -p 'test_fresh_adapter_profile.py'
          if ($LASTEXITCODE -ne 0) { throw 'Fresh adapter source guards failed' }
          @{source_commit='${{ github.sha }}'; policy_contract_passed=$true; windows_read_only_binding_passed=$true; source_guards_passed=$true; tunnel_started=$false; network_configuration_changed=$false; adapter_ownership_qualified=$false; release_ready=$false} | ConvertTo-Json | Set-Content build/probe-evidence/fresh-adapter-contract.json
      - name: Verify read-only CI observer and exact alias pattern without SDK startup
        run: |
          cl /nologo /std:c++20 /W4 /WX /EHsc /DNOMINMAX native/health/test_probe_admission.cpp /Fobuild/probe-admission.obj /Febuild/probe-admission.exe
          if ($LASTEXITCODE -ne 0) { throw 'Probe admission contract build failed' }
          & ./build/probe-admission.exe
          if ($LASTEXITCODE -ne 0) { throw 'Probe admission contract failed' }
          python -m unittest discover -s tools/service -p 'test_adapter_discovery.py'
          if ($LASTEXITCODE -ne 0) { throw 'Adapter discovery fixture contract failed' }
          python tools/service/check_adapter_discovery.py --output build/probe-evidence/adapter-discovery.json
          if ($LASTEXITCODE -ne 0) { throw 'Adapter discovery Windows binding failed' }
          @{bounded_readiness_observation_passed=$true; late_proof_refused=$true; terminal_faults_not_retried=$true; cancel_before_admission_passed=$true; frozen_or_backwards_clock_refused=$true; actual_sdk_readiness_tested=$false; tunnel_started=$false; release_ready=$false} | ConvertTo-Json | Set-Content build/probe-evidence/probe-admission.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-probe-contract-evidence
          path: build/probe-evidence/
          retention-days: 7
          if-no-files-found: warn
