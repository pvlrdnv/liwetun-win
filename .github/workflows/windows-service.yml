name: Windows signed service qualification
on:
  workflow_dispatch:
    inputs:
      source_pins:
        description: Qualify the separately pinned immutable-source SDK candidate
        type: boolean
        default: false
      traffic_metrics:
        description: Qualify the separate aggregate-traffic SDK candidate (requires source_pins)
        type: boolean
        default: false
      sdk_run_id:
        description: Optional successful SDK qualification run for actual DLL admission
        required: false
        type: string
      production_lifecycle:
        description: Disposable CI only - production routing config with a refused synthetic endpoint, no Internet qualification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  service:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SOURCE_PINNED: ${{ inputs.source_pins }}
      TRAFFIC_METRICS: ${{ inputs.traffic_metrics }}
      SDK_RUN_ID: ${{ inputs.sdk_run_id }}
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_LIFECYCLE: ${{ inputs.production_lifecycle }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build actual service and adversarial client
        run: |
          if ($env:TRAFFIC_METRICS -eq 'true' -and ($env:SOURCE_PINNED -ne 'true' -or !$env:SDK_RUN_ID)) { throw 'Traffic SDK requires immutable pins and its reviewed run' }
          if ($env:SOURCE_PINNED -eq 'true' -and !$env:SDK_RUN_ID) { throw 'Candidate qualification requires pinned SDK' }
          if ($env:PRODUCTION_LIFECYCLE -eq 'true' -and !$env:SDK_RUN_ID) { throw 'Production lifecycle requires pinned SDK' }
          $noGlobalRoutes = if ($env:PRODUCTION_LIFECYCLE -eq 'true') { 'OFF' } else { 'ON' }
          cmake -S native/service -B build/service -A x64 "-DLIWETUN_TEST_NO_GLOBAL_ROUTES=$noGlobalRoutes" -DLIWETUN_TEST_TUN_NETWORK=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Service configure failed' }
          cmake --build build/service --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          cargo run --manifest-path native/trusttunnel_bridge/Cargo.toml --locked --release --example synthetic_fixture -- build/native-fixture.json
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed' }
          $fixtures = Get-Content build/native-fixture.json -Raw | ConvertFrom-Json
          $fixtures.SYNTHETIC_TT_SERVICE_LOCAL | Set-Content -Encoding utf8 build/service-local-uri.txt
      - name: Fetch optional qualified SDK only from this repository
        if: env.SDK_RUN_ID != ''
        run: |
          if ($env:SDK_RUN_ID -notmatch '^[0-9]{1,20}$') { throw 'Invalid SDK run ID' }
          if ($env:TRAFFIC_METRICS -eq 'true' -and $env:SOURCE_PINNED -ne 'true') { throw 'Traffic SDK requires immutable source pins' }
          $pinFile = if ($env:TRAFFIC_METRICS -eq 'true') { 'native/sdk/runtime-traffic.json' } elseif ($env:SOURCE_PINNED -eq 'true') { 'native/sdk/runtime-sources.json' } else { 'native/sdk/runtime.json' }
          $pin = Get-Content $pinFile -Raw | ConvertFrom-Json
          if ($env:SOURCE_PINNED -eq 'true') {
            if ($pin.source_pin_manifest_sha256 -ne (Get-FileHash native/sdk/source-pins.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.conan_input_lock_sha256 -ne (Get-FileHash native/sdk/conan-sources.lock -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.source_pinned_candidate -ne $true -or $pin.release_qualified -ne $false) { throw 'Candidate SDK source receipt mismatch' }
          }
          if ($env:TRAFFIC_METRICS -eq 'true') {
            if ($pin.traffic_profile_manifest_sha256 -ne (Get-FileHash native/sdk/traffic-inputs.json -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.traffic_abi_header_sha256 -ne (Get-FileHash native/traffic/traffic_abi.h -Algorithm SHA256).Hash.ToLowerInvariant() -or $pin.traffic_abi -ne 1 -or $pin.sdk_variant -ne 'aggregate_traffic_candidate') { throw 'Traffic SDK receipt mismatch' }
          }
          if ($env:SDK_RUN_ID -ne [string]$pin.source_run) { throw 'SDK run does not match reviewed runtime manifest' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SDK_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.name -ne 'Windows SDK qualification' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $pin.source_commit) { throw 'SDK source run not qualified' }
          gh run download $env:SDK_RUN_ID --repo $env:GITHUB_REPOSITORY --name sdk-development-runtime-not-for-release --dir build/sdk-runtime
          if ($LASTEXITCODE -ne 0) { throw 'SDK artifact download failed' }
          foreach ($file in @('trusttunnel.dll','wintun.dll')) {
            if ((Get-FileHash (Join-Path build/sdk-runtime $file) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.files.PSObject.Properties[$file].Value) { throw 'SDK input digest mismatch' }
          }
          New-Item -ItemType Directory -Force build/service-evidence | Out-Null
          Copy-Item $pinFile build/service-evidence/sdk-runtime-input.json
      - name: Real signing, installation, IPC rejection and cleanup on disposable runner
        run: |
          if ($env:PRODUCTION_LIFECYCLE -eq 'true') { ./tools/service/qualify.ps1 -Sdk build/sdk-runtime -ProductionLifecycle }
          elseif ($env:SDK_RUN_ID) { ./tools/service/qualify.ps1 -Sdk build/sdk-runtime }
          else { ./tools/service/qualify.ps1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: signed-service-qualification
          path: build/service-evidence/
          retention-days: 7
          if-no-files-found: warn
