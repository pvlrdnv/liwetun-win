name: SDK candidate source recipe pins
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipes:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AdguardTeam/NativeLibsCommon
          ref: c546b329360642576cea25f10bdcbf41d52163df
          path: build/vendor/common
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AdguardTeam/DnsLibs
          ref: 3d6359be7b99e2eccbfe905e970dd08a7f1d9108
          path: build/vendor/dns
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Export and verify original and candidate recipe revisions
        run: |
          python -m pip install conan==2.12.2
          if ($LASTEXITCODE -ne 0) { throw 'Conan install failed' }
          $actual = (git -C build/vendor/common rev-parse HEAD).Trim()
          if ($actual -ne 'c546b329360642576cea25f10bdcbf41d52163df') { throw 'Common source revision mismatch' }
          $dnsActual = (git -C build/vendor/dns rev-parse HEAD).Trim()
          if ($dnsActual -ne '3d6359be7b99e2eccbfe905e970dd08a7f1d9108') { throw 'DNS source revision mismatch' }
          python tools/sdk/pin_sources.py --source build/vendor/common --dns-source build/vendor/dns --output build/source-pin-evidence --check-archives
          if ($LASTEXITCODE -ne 0) { throw 'Candidate recipe revision qualification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sdk-candidate-source-pin-evidence
          path: build/source-pin-evidence/
          retention-days: 14
          if-no-files-found: error
