name: Official endpoint UDP isolation
on:
  workflow_dispatch:
    inputs:
      source_fix:
        description: Build pinned diagnostic endpoint with nonblocking SOCKS5 UDP fix
        required: false
        default: false
        type: boolean
      stream_close_fix:
        description: Opt-in disposable H3 parked-reader wakeup candidate (requires source_fix)
        required: false
        default: false
        type: boolean
      shutdown_completion_fix:
        description: Opt-in bounded graceful shutdown completion candidate (requires both preceding fixes)
        required: false
        default: false
        type: boolean
      endpoint_version:
        required: true
        default: v1.1.0
        type: choice
        options:
          - v1.1.0
          - v1.3.0-beta.2
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      LIWETUN_ENDPOINT_VERSION: ${{ inputs.endpoint_version }}
      LIWETUN_ENDPOINT_SOURCE_FIX: ${{ inputs.source_fix }}
      LIWETUN_ENDPOINT_CLOSE_FIX: ${{ inputs.stream_close_fix }}
      LIWETUN_ENDPOINT_SHUTDOWN_FIX: ${{ inputs.shutdown_completion_fix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify exact official endpoint binary
        if: ${{ !inputs.source_fix }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          version = os.environ['LIWETUN_ENDPOINT_VERSION']
          pins = {
              'v1.1.0': '91c2ea3db7416a01b5258a4c047ec22890490bc55e1b194206031aa75144f0e7',
              'v1.3.0-beta.2': '496a27ff72014b883438efab55ffd237183b5ff95d9c341cc0de9d18342a9b11',
          }
          expected = pins[version]
          directory = pathlib.Path('build/endpoint')
          directory.mkdir(parents=True)
          archive = pathlib.Path('build/endpoint.tar.gz')
          subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error',
                          '--max-time', '120', '--output', str(archive),
                          f'https://github.com/TrustTunnel/TrustTunnel/releases/download/{version}/trusttunnel-{version}-linux-x86_64.tar.gz'], check=True)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Endpoint digest mismatch')
          subprocess.run(['tar', '-xf', str(archive), '-C', str(directory), '--strip-components=1'], check=True)
          PY
      - name: Validate explicit endpoint wakeup experiment
        run: |
          if [ "$LIWETUN_ENDPOINT_CLOSE_FIX" = 'true' ] && [ "$LIWETUN_ENDPOINT_SOURCE_FIX" != 'true' ]; then exit 2; fi
          if [ "$LIWETUN_ENDPOINT_SHUTDOWN_FIX" = 'true' ] && [ "$LIWETUN_ENDPOINT_CLOSE_FIX" != 'true' ]; then exit 2; fi
          python3 -m unittest discover -s tools/service -p 'test_endpoint_close_profile.py'
          python3 -m unittest discover -s tools/service -p 'test_endpoint_shutdown_profile.py'
      - name: Build hash-checked diagnostic source fix
        if: ${{ inputs.source_fix }}
        run: |
          test "$LIWETUN_ENDPOINT_VERSION" = 'v1.1.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev cmake ninja-build pkg-config
          rustup toolchain install 1.95.0 --profile minimal
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          pin = json.loads(pathlib.Path('tools/service/endpoint-source.json').read_text())
          archive = pathlib.Path('build/endpoint-source.tar.gz')
          archive.parent.mkdir(exist_ok=True)
          subprocess.run(['curl', '--fail', '--location', '--silent', '--show-error', '--max-time', '120',
                          '--output', str(archive), 'https://codeload.github.com/TrustTunnel/TrustTunnel/tar.gz/' + pin['source_commit']], check=True)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != pin['source_archive_sha256']:
              raise SystemExit('Source archive digest mismatch')
          source = pathlib.Path('build/endpoint-source')
          source.mkdir()
          subprocess.run(['tar', '-xf', str(archive), '-C', str(source), '--strip-components=1'], check=True)
          PY
          python3 tools/service/prepare_endpoint.py prepare
          if [ "$LIWETUN_ENDPOINT_CLOSE_FIX" = 'true' ]; then python3 tools/service/endpoint_close_profile.py prepare; fi
          if [ "$LIWETUN_ENDPOINT_SHUTDOWN_FIX" = 'true' ]; then python3 tools/service/endpoint_shutdown_profile.py prepare; fi
          cargo +1.95.0 build --manifest-path build/endpoint-source/Cargo.toml --locked --release --package trusttunnel_endpoint --jobs 2
          mkdir -p build/endpoint
          cp build/endpoint-source/target/release/trusttunnel_endpoint build/endpoint/
          strip --strip-debug build/endpoint/trusttunnel_endpoint
          python3 tools/service/prepare_endpoint.py record
          if [ "$LIWETUN_ENDPOINT_CLOSE_FIX" = 'true' ]; then python3 tools/service/endpoint_close_profile.py record; fi
          if [ "$LIWETUN_ENDPOINT_SHUTDOWN_FIX" = 'true' ]; then python3 tools/service/endpoint_shutdown_profile.py record; fi
      - name: Endpoint-only authenticated UDP wire control
        run: python3 tools/service/endpoint_udp_isolation.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: endpoint-udp-safe-evidence
          path: build/endpoint-evidence/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ success() && inputs.source_fix }}
        with:
          name: diagnostic-endpoint-not-for-release
          path: build/endpoint/
          retention-days: 14
          if-no-files-found: error
